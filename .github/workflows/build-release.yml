name: Build Melty release asset

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build release ZIP
        run: |
          zip -r SurvivalZomboid-v0.1.2.zip docs sheets src generate.py preflight.py test_model.py

      - name: Create or update v0.1.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.2 >/dev/null 2>&1; then
            gh release create v0.1.2 SurvivalZomboid-v0.1.2.zip --title "v0.1.2" --notes "Single-player UE4SS package without README.md."
          else
            gh release upload v0.1.2 SurvivalZomboid-v0.1.2.zip --clobber
          fi
