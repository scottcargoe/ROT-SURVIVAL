name: Build Melty release asset

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build release ZIP
        run: |
          zip -r SurvivalZomboid-v0.1-foundation.zip README.md docs sheets src generate.py preflight.py test_model.py

      - name: Attach ZIP to v0.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload Test SurvivalZomboid-v0.1-foundation.zip --clobber
