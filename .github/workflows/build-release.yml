name: Build Melty release asset

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build release ZIP
        run: |
          zip -r SurvivalZomboid-v0.1.1.zip README.md docs sheets src generate.py preflight.py test_model.py

      - name: Create or update v0.1.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.1 >/dev/null 2>&1; then
            gh release create v0.1.1 SurvivalZomboid-v0.1.1.zip --title "v0.1.1" --notes "Single-player v0.1.1 package for Melty."
          else
            gh release upload v0.1.1 SurvivalZomboid-v0.1.1.zip --clobber
          fi
